name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Current Home Assistant releases require Python 3.14.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/requirements*.txt

      - name: Install test dependencies
        run: uv pip install --system -r tests/requirements_ha.txt

      - name: Run unit tests
        run: python -m pytest tests -v

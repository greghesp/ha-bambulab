name: Translation parity

# Missing/stale keys and placeholder errors remain informational warnings.
# Translation findings do not block merging while locales catch up.

on:
  push:
    paths:
      - "custom_components/bambu_lab/translations/**"
      - "scripts/check_translation_parity.py"
      - ".github/workflows/translation-parity.yml"
  pull_request:
    paths:
      - "custom_components/bambu_lab/translations/**"
      - "scripts/check_translation_parity.py"
      - ".github/workflows/translation-parity.yml"

permissions:
  # The repo's default token is read-only, and setting this block drops every
  # scope not listed. checkout needs contents: read. Commenting on a PR goes
  # through the Issues API, but GitHub requires both issues: write and
  # pull-requests: write for it (x-accepted-github-permissions on the 403).
  contents: read
  issues: write
  pull-requests: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: check
        run: python3 scripts/check_translation_parity.py

      # Comments are only meaningful in a PR context (push events - e.g. a
      # merge to main - have no PR to comment on).
      # Reporting is best-effort: a failed comment must never fail the check.
      - if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            // GitHub forces a read-only GITHUB_TOKEN for pull_request runs
            // triggered from a fork, regardless of the `permissions:` block
            // above - so createComment/updateComment always 403s here. Skip
            // rather than let reporting fail for every external contributor.
            const isFork = context.payload.pull_request.head.repo.full_name !==
                            context.payload.pull_request.base.repo.full_name;
            if (isFork) {
              core.notice("Skipping PR comment: forked PRs get a read-only token, so this check can't comment here. See the step above for the parity results.");
              return;
            }

            const fs = require("fs");
            const marker = "<!-- translation-parity-check -->";
            const body = fs.readFileSync("translation_parity_comment.md", "utf8");
            const drift = "${{ steps.check.outputs.drift }}" === "true";

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            try {
              const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.data.find((c) => c.body.startsWith(marker));

              if (!drift && !existing) {
                // Common case: no drift, and we've never had anything to say. Stay silent.
                return;
              }
              if (existing) {
                // Update our previous comment in place, whether that's new drift
                // details or flipping it over to "resolved".
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              core.warning(`Could not post the translation parity comment: ${error.message}. See the step above for the parity results.`);
            }
